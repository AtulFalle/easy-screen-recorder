[workspace]
resolver = "2"
members = [
    "crates/lightcapture-core",
    "crates/lightcapture-cli",
    "crates/lightcapture-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"
authors = ["LightCapture contributors"]
description = "Lightweight native Windows screen recorder"
publish = false
