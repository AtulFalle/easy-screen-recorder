name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Test
        run: cargo test --workspace --locked

      - name: Build tray app
        run: cargo build --release --locked -p lightcapture-app

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          .\scripts\build-installer.ps1 -AppVersion $version -ExePath target\release\lightcapture.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/LightCapture-Setup-${{ steps.installer.outputs.version }}.exe
            dist/LightCapture-Setup-${{ steps.installer.outputs.version }}.exe.sha256
          body: |
            Windows installer for LightCapture.

            Run **LightCapture-Setup-*.exe**. No Rust install and no scripts.

            - Choose install for me (default, no admin) or for everyone.
            - Start Menu and desktop shortcuts are created (desktop is optional in the wizard).
            - The app lives in the notification area (tray). There is no main window.
            - `Ctrl+Shift+R` starts and stops recording. `Ctrl+Shift+P` pauses.
            - Recordings default to `Videos\LightCapture`.

            Requires Windows 10 version 1903 or later (x64). Windows SmartScreen may warn because this build is not code-signed. Choose **More info** → **Run anyway**.
