name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Test
        run: cargo test --workspace --locked

      - name: Build tray app
        run: cargo build --release --locked -p lightcapture-app

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\lightcapture.exe dist\LightCapture.exe
          $hash = (Get-FileHash dist\LightCapture.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\LightCapture.exe.sha256 -Value "$hash  LightCapture.exe" -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name == 'v0.1.0' && 'mvp0' || github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/LightCapture.exe
            dist/LightCapture.exe.sha256
          body: |
            First downloadable Windows build of LightCapture.

            Double-click **LightCapture.exe**. No Rust install and no scripts.

            - The app lives in the notification area (tray). There is no main window.
            - `Ctrl+Shift+R` starts and stops recording.
            - Right-click the tray icon for quality, capture source, output folder, and cursor.
            - Recordings default to `Videos\LightCapture`.

            Requires Windows 10 version 1903 or later (x64). Windows SmartScreen may warn because this build is not code-signed.
